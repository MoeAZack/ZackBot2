# ZackBot PR fast check (T04d round 2). The ONLY producer of the required "verify fast" check: one run per PR commit.
# Default pull_request types (opened/synchronize/reopened) into master run it; it has no job-level condition, so it is never
# skipped. Labels do not re-run it. The final full gate runs only when Codex adds the `full-ready` label (verify.yml, on the
# exact PR head); master pushes run "push fast" (verify-push.yml).
name: verify-fast

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Africa/Cairo
  # Golden-pack ledger base (tests/golden/test_ledger.py): the immutable PR base, fetched explicitly below. The test FAILS when
  # it is missing or not fetched; it never falls back to a ref the shallow checkout does not have.
  ZB_GOLDEN_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  fast:
    name: verify fast
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the PR base commit (golden-pack append-only check)
        run: |
          [[ "$ZB_GOLDEN_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "PR base sha missing or malformed: '$ZB_GOLDEN_BASE'"; exit 1; }
          git fetch --no-tags --depth=1 origin "$ZB_GOLDEN_BASE"
          git cat-file -e "$ZB_GOLDEN_BASE^{commit}"
          # BT-EXEC-OBS-01 pins registered prereg bytes and the empty /2 envelope set at this immutable baseline.
          git fetch --no-tags --depth=1 origin 09445476a1bb694ee7135f350928762bc793db50
          git cat-file -e '0944547^{commit}'
          # FACTORY-F01F02-REPRO pins its reproduced code identity as content-addressed blobs of this exact commit.
          git fetch --no-tags --depth=1 origin f189ff7ba64a4ce2a3ed0a6699f556335df33e14
          git cat-file -e 'f189ff7ba64a4ce2a3ed0a6699f556335df33e14^{commit}'
          # C257 inherits exact C256 economics from this terminal pre-market contract object.
          git fetch --no-tags --depth=1 origin 6cc7148a453be054f5c02ecf1eecc8369fcfc533
          git cat-file -e '6cc7148a453be054f5c02ecf1eecc8369fcfc533^{commit}'
          # C257 hostile-tree tests clone this exact protected baseline from the local checkout.
          git fetch --no-tags --depth=1 origin a02c33f3cc343ee2af09bffcf35adb5a26fc0fd8
          git cat-file -e 'a02c33f3cc343ee2af09bffcf35adb5a26fc0fd8^{commit}'
          # Protected C257 authentication resolves this immutable original scaffold, including after squash merges.
          git fetch --no-tags --depth=1 origin 27f3eef77a4d10d300a288ef917fc5842170550d
          git cat-file -e '27f3eef77a4d10d300a288ef917fc5842170550d^{commit}'
          git cat-file -e '27f3eef77a4d10d300a288ef917fc5842170550d:research_evidence/prereg/funding_shock_reversal_xsec_c257_successor.v1.json'
          # C259 hostile fixtures bind frozen content onto the protected preregistration base.
          git fetch --no-tags --depth=1 origin 64adf3a41d7a521d2af480adc7b2f23a8fa6a0c3 82d02b82b774e92ffa374e6ea1be8ba5c0cfb98c
          git cat-file -e '64adf3a41d7a521d2af480adc7b2f23a8fa6a0c3^{commit}'
          git cat-file -e '82d02b82b774e92ffa374e6ea1be8ba5c0cfb98c^{commit}'
      - name: Fetch the breadth_static40 registration tag (annotated, peels to Y)
        run: |
          git fetch --no-tags --depth=2 origin +refs/tags/zb-breadth-static40-v1-registration-20261016:refs/tags/zb-breadth-static40-v1-registration-20261016
          test "$(git cat-file -t refs/tags/zb-breadth-static40-v1-registration-20261016)" = tag
          test "$(git rev-parse 'refs/tags/zb-breadth-static40-v1-registration-20261016^{commit}')" = ec8249e31239e0f1c3f897f91946b0fe875e37d5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: verify fast
        run: python verify.py fast --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-fast-${{ github.sha }}
          path: verify_out/
          retention-days: 1
