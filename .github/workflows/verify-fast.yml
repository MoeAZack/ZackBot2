# ZackBot PR fast check (T04d round 2). The ONLY producer of the required "verify fast" check: one run per PR commit.
# Default pull_request types (opened/synchronize/reopened) into master run it; it has no job-level condition, so it is never
# skipped. Labels do not re-run it. The final full gate runs only when Codex adds the `full-ready` label (verify.yml, on the
# exact PR head); master pushes run "push fast" (verify-push.yml).
name: verify-fast

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Africa/Cairo

jobs:
  fast:
    name: verify fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: verify fast
        run: python verify.py fast --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-fast-${{ github.sha }}
          path: verify_out/
          retention-days: 30
