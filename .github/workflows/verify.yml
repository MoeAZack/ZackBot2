# ZackBot required verification (T04; T04d: parallel full). Same gates as on the PC: python verify.py fast|full.
# This workflow is the ONLY producer of the required checks "verify fast" and "verify full", and every run of it executes
# both: no skipped or reused required check (Codex T04d review). Pushes run the separate, non-required verify-push.yml.
# "verify full" = three parallel slices of verify.FULL_PLAN (tests | replay 2 | replay 1 + UI harness), merged by the
# required job, which fails unless the slices cover exactly the plan and every slice ran on this commit and passed.
# release (rollback drill + running-bot reconciliation) needs the owner's Windows install: run verify_release.bat on the PC.
name: verify

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TZ: Africa/Cairo

jobs:
  fast:
    name: verify fast
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: verify fast
        run: python verify.py fast --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-fast-${{ github.sha }}
          path: verify_out/
          retention-days: 30

  full-part:
    name: full slice ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [tests, replay2, replay1-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install the UI harness (replay1-ui only)
        if: matrix.part == 'replay1-ui'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ui.txt
          python -m playwright install --with-deps chromium
      - name: verify full slice
        run: python verify_ci.py part ${{ matrix.part }} --out verify_out
      - name: Upload slice summary and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-full-${{ matrix.part }}-${{ github.sha }}
          path: verify_out/
          retention-days: 30

  full:
    name: verify full
    needs: full-part
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Download slice summaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verify-full-*-${{ github.sha }}
          path: parts/
      - name: verify full (merge the slices)
        run: python verify_ci.py merge --parts parts --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-full-${{ github.sha }}
          path: verify_out/
          retention-days: 30
