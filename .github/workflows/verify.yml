# ZackBot verification (T04, faster in T04d). Same gates as on the PC: python verify.py fast|full.
# fast: every push and pull request. full: pull requests into master, and on demand (Actions -> verify -> Run workflow).
# T04d: "verify full" runs as three parallel slices (tests | replay 2 | replay 1 + UI harness), merged by the required
# "verify full" job, which fails unless every slice ran on this commit and every step passed (verify_ci.py merge).
# T04d: a docs/-only change on top of a commit whose same check already passed reuses that result (verify_ci.py reused,
# heavy steps recorded as SKIPPED/REUSED with the commit and run). Anything else - or any doubt - runs the full gate.
# release (rollback drill + running-bot reconciliation) needs the owner's Windows install: run verify_release.bat on the PC.
name: verify

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      level:
        description: 'fast or full'
        type: choice
        options: [full, fast]
        default: full

permissions:
  contents: read
  checks: read

concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  TZ: Africa/Cairo
  ZB_BEFORE: ${{ github.event.before }}
  ZB_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan:
    name: plan (docs-only reuse?)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reuse_fast: ${{ steps.plan.outputs.reuse_fast }}
      reuse_full: ${{ steps.plan.outputs.reuse_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python verify_ci.py plan --event "${{ github.event_name }}" --before "$ZB_BEFORE" --head "$ZB_HEAD"

  fast:
    name: verify fast
    needs: plan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: verify fast (reused - docs-only change)
        if: needs.plan.outputs.reuse_fast == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python verify_ci.py reused fast --event "${{ github.event_name }}" --before "$ZB_BEFORE" --head "$ZB_HEAD" --out verify_out
      - name: verify fast
        if: needs.plan.outputs.reuse_fast != 'true'
        run: python verify.py fast --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-fast-${{ github.sha }}
          path: verify_out/
          retention-days: 30

  full-part:
    name: full slice ${{ matrix.part }}
    needs: plan
    if: >-
      always() && needs.plan.outputs.reuse_full != 'true' &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
    strategy:
      fail-fast: false
      matrix:
        part: [tests, replay2, replay1-ui]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-ui.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install the UI harness (replay1-ui only)
        if: matrix.part == 'replay1-ui'
        run: |
          python -m pip install --disable-pip-version-check -r requirements-ui.txt
          python -m playwright install --with-deps chromium
      - name: verify full slice
        run: python verify_ci.py part ${{ matrix.part }} --out verify_out
      - name: Upload slice summary and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-full-${{ matrix.part }}-${{ github.sha }}
          path: verify_out/
          retention-days: 30

  full:
    name: verify full
    needs: [plan, full-part]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.level == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Download slice summaries
        if: needs.plan.outputs.reuse_full != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verify-full-*-${{ github.sha }}
          path: parts/
      - name: verify full (reused - docs-only change)
        if: needs.plan.outputs.reuse_full == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python verify_ci.py reused full --event "${{ github.event_name }}" --before "$ZB_BEFORE" --head "$ZB_HEAD" --out verify_out
      - name: verify full (merge the three slices)
        if: needs.plan.outputs.reuse_full != 'true'
        run: python verify_ci.py merge --parts parts --out verify_out
      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verify-full-${{ github.sha }}
          path: verify_out/
          retention-days: 30
