name: prune-actions-cache

on:
  workflow_run:
    workflows: [verify-push]
    types: [completed]
    branches: [master]

permissions: {}

jobs:
  prune:
    name: prune stale Actions caches
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete caches unused for two days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '2 days ago' +%s)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .last_accessed_at] | @tsv' |
          while IFS=$'\t' read -r cache_id last_accessed; do
            [ -n "$cache_id" ] || continue
            accessed="$(date -u -d "$last_accessed" +%s)"
            if [ "$accessed" -lt "$cutoff" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$cache_id"
            fi
          done
